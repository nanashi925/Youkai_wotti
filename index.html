<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妖怪バトル</title>
<style>
  body { background:#222; color:#fff; font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
         display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
  #game { width:480px; background:linear-gradient(#7ec8e3,#bde8c0 70%,#8a6d3b 70%); border:6px solid #fff;
          border-radius:12px; padding:16px; box-shadow:0 0 20px #000; }
  .unit { display:flex; justify-content:space-between; align-items:center; margin:8px 0; }
  .sprite { font-size:56px; transition:transform .15s; }
  .shake { transform:translateX(-10px) rotate(-10deg); }
  .panel { background:rgba(0,0,0,.65); border-radius:8px; padding:8px 12px; min-width:230px; }
  .hpbar { background:#444; border-radius:6px; height:14px; overflow:hidden; margin-top:4px; }
  .hpfill { background:linear-gradient(#ffe14d,#f5a623); height:100%; transition:width .3s; }
  #log { background:rgba(0,0,0,.75); border-radius:8px; min-height:64px; padding:10px; margin-top:12px; font-size:14px; line-height:1.6; }
  #cmds { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  button { background:#ff5a00; color:#fff; border:3px solid #fff; border-radius:24px; padding:10px;
           font-size:16px; font-weight:bold; cursor:pointer; }
  button:hover { background:#ff7a30; }
  button:disabled { background:#888; cursor:default; }
  #bgmBtn { background:#3478f6; }
</style>
</head>
<body>
<div id="game">
  <div class="unit">
    <div class="panel">
      <b id="eName"></b> Lv<span id="eLv"></span>
      <div class="hpbar"><div class="hpfill" id="eHp"></div></div>
    </div>
    <div class="sprite" id="eSpr">👻</div>
  </div>
  <div class="unit">
    <div class="sprite" id="aSpr">😼</div>
    <div class="panel">
      <b>破怪</b> Lv99
      <div class="hpbar"><div class="hpfill" id="aHp"></div></div>
    </div>
  </div>
  <div id="log">ようかいが あらわれた！</div>
  <div id="cmds">
    <button onclick="act('attack')">たたかう</button>
    <button onclick="act('skill')">ようじゅつ「やぶれの術」</button>
    <button onclick="act('soul')">ひっさつわざ「破壊光線」</button>
    <button id="bgmBtn" onclick="toggleBgm()">♪ BGM ON</button>
  </div>
</div>

<script>
// ---- バトルデータ ----
const ally = { name:"破怪", lv:99, maxHp:520, hp:520, atk:160 };
const enemies = [
  { name:"ネガティブーン", spr:"👻", maxHp:120, atk:18 },
  { name:"ヒキコウモリ",   spr:"🦇", maxHp:140, atk:22 },
  { name:"ジミー",         spr:"🌫️", maxHp:100, atk:15 },
];
let enemy, busy = false;

function spawn() {
  const e = enemies[Math.floor(Math.random() * enemies.length)];
  enemy = { ...e, hp: e.maxHp, lv: 5 };
  document.getElementById("eName").textContent = enemy.name;
  document.getElementById("eLv").textContent = enemy.lv;
  document.getElementById("eSpr").textContent = enemy.spr;
  ally.hp = ally.maxHp;
  render();
  say(`${enemy.name}が あらわれた！`);
}

function render() {
  document.getElementById("aHp").style.width = (ally.hp / ally.maxHp * 100) + "%";
  document.getElementById("eHp").style.width = (enemy.hp / enemy.maxHp * 100) + "%";
}
function say(t) { document.getElementById("log").innerHTML = t; }
function shake(id) {
  const el = document.getElementById(id);
  el.classList.add("shake");
  setTimeout(() => el.classList.remove("shake"), 150);
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function act(type) {
  if (busy) return;
  busy = true;
  let dmg, msg;
  if (type === "attack")     { dmg = ally.atk + rnd(30); msg = `破怪の こうげき！`; }
  else if (type === "skill") { dmg = ally.atk * 1.5 + rnd(40); msg = `破怪の ようじゅつ「やぶれの術」！`; }
  else                       { dmg = ally.atk * 2.5 + rnd(60); msg = `ひっさつわざ「破壊光線」！！`; }
  dmg = Math.floor(dmg);
  sfx(type);
  shake("eSpr");
  enemy.hp = Math.max(0, enemy.hp - dmg);
  render();
  say(`${msg}<br>${enemy.name}に ${dmg} のダメージ！`);
  await wait(900);

  if (enemy.hp <= 0) {
    say(`${enemy.name}を たおした！🎉<br>けいけんち ${10 + rnd(20)} かくとく！（Lv99なので むいみ）`);
    await wait(2200);
    spawn();
    busy = false;
    return;
  }
  // 敵のターン
  const edmg = enemy.atk + rnd(10);
  sfx("hit");
  shake("aSpr");
  ally.hp = Math.max(0, ally.hp - edmg);
  render();
  say(`${enemy.name}の こうげき！<br>破怪に ${edmg} のダメージ！`);
  if (ally.hp <= 0) {
    await wait(900);
    say(`破怪は たおれてしまった…<br>…なんてことは Lv99には ありえなかった！ぜんかいふく！`);
    ally.hp = ally.maxHp;
    render();
  }
  busy = false;
}
const rnd = n => Math.floor(Math.random() * n);

// ---- BGM / SFX（Web Audio・オリジナルのチップチューン風） ----
let ctx, bgmOn = false, bgmTimer;
function audio() { return ctx ||= new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, t0, type = "square", vol = .08) {
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(t0); o.stop(t0 + dur);
}
// ゆるコミカルな和風バトル風ループ（8小節相当）
const melody = [392,440,392,330, 392,440,523,440, 392,440,392,330, 294,330,392,0,
                523,494,440,392, 440,494,523,587, 523,494,440,392, 330,294,330,0];
const bass   = [196,0,147,0, 196,0,147,0, 196,0,147,0, 131,0,165,0,
                175,0,131,0, 196,0,147,0, 175,0,131,0, 165,0,98,0];
function playLoop() {
  const c = audio(), bpm = 150, step = 60 / bpm / 2, t0 = c.currentTime + .05;
  melody.forEach((f, i) => { if (f) tone(f, step * .9, t0 + i * step, "square", .06); });
  bass.forEach((f, i)   => { if (f) tone(f, step * .9, t0 + i * step, "triangle", .1); });
  bgmTimer = setTimeout(playLoop, melody.length * step * 1000);
}
function toggleBgm() {
  bgmOn = !bgmOn;
  document.getElementById("bgmBtn").textContent = bgmOn ? "♪ BGM OFF" : "♪ BGM ON";
  if (bgmOn) { audio().resume(); playLoop(); } else clearTimeout(bgmTimer);
}
function sfx(type) {
  const t = audio().currentTime;
  if (type === "attack") { tone(880, .1, t); tone(660, .1, t + .05); }
  else if (type === "skill") { tone(523, .08, t); tone(659, .08, t + .08); tone(784, .15, t + .16); }
  else if (type === "soul") { for (let i = 0; i < 6; i++) tone(400 + i * 150, .1, t + i * .05, "sawtooth", .05); }
  else tone(220, .15, t, "sawtooth", .07);
}

spawn();
</script>
</body>
</html>
